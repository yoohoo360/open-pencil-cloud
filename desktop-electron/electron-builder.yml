# Reference config. `bun run build` writes a self-contained copy into the
# isolated stage under os.tmpdir() — edit scripts/build.ts to change packaging.
appId: net.dannote.open-pencil.electron
productName: OpenPencil
directories:
  app: .release-stage
  output: release
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false
