name: react ui deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

      version_type:
        description: 'Version type (major, minor, patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      offset:
        description: 'Version offset (default is 0)'
        required: false
        type: number
        default: 0

permissions:
  contents: write

env:
  GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
  GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
  APP_NAME: open-pencil-react
  TAG_PREFIX: open-pencil-react-v
  BUILD_DIR: packages/react
  DIST_DIR: packages/react/dist
  REMOTE_TMP_TAR: /tmp/dist.tar.gz
  TAR_FILE: dist.tar.gz
  SSH_PORT: ${{ vars.SSH_PORT }}
  SSH_USERNAME: ${{ vars.SSH_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ "${{ github.event.inputs.target_env }}" = "prod" ]; then
            bun run build:prod
          else
            bun run build:test
          fi

      - name: Show build dist dir
        run: |
          ls -al "${{ env.DIST_DIR }}"

      - name: Get latest version tag
        id: latest
        run: |
          git fetch --tags
          TAG=$(git tag --sort=-v:refname | grep -E "^${{ env.TAG_PREFIX }}[0-9]+\.[0-9]+\.[0-9]+$" | head -n1)
          echo "Found latest tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "base_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "base_version=${TAG#${{ env.TAG_PREFIX }}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new version
        id: version
        run: |
          BASE="${{ steps.latest.outputs.base_version }}"
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
          TARGET_ENV="${{ github.event.inputs.target_env }}"
          OFFSET="${{ github.event.inputs.offset }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "$VERSION_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$VERSION_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          PATCH=$((PATCH + OFFSET))
          VERSION="$MAJOR.$MINOR.$PATCH"

          if [ "$TARGET_ENV" = "dev" ]; then
            COUNT=$(git tag | grep "^${{ env.TAG_PREFIX }}$VERSION-beta" | wc -l)
            VERSION="$VERSION-beta.$((COUNT + 1))"
          fi

          echo "✅ version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        run: |
          TAG_NAME="${{ env.TAG_PREFIX }}${{ steps.version.outputs.version }}"
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Set up SSH and deploy
        env:
          SERVER_IP: ${{ vars.SERVER_IP }}
          TARGET_DIR: ${{ vars.TARGET_DIR }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dev.key
          chmod 600 ~/.ssh/dev.key

          ssh-keyscan -p "$SSH_PORT" "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          tar -czf "$TAR_FILE" "$DIST_DIR"

          scp -i ~/.ssh/dev.key -P "$SSH_PORT" "$TAR_FILE" "$SSH_USERNAME@$SERVER_IP:$REMOTE_TMP_TAR"

          ssh -i ~/.ssh/dev.key -p "$SSH_PORT" "$SSH_USERNAME@$SERVER_IP" "
            set -e
            mkdir -p '$TARGET_DIR'
            rm -rf '$TARGET_DIR'/*
            tar -xzf '$REMOTE_TMP_TAR' -C '$TARGET_DIR' --strip-components=1
            rm -f '$REMOTE_TMP_TAR'
            cd /data/docker-mnt && docker compose exec -T nginx nginx -s reload
          "

          rm -f "$TAR_FILE"
