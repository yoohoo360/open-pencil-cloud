name: server build


on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type (major, minor, patch)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_type:
        description: "Release type (prod or beta)"
        required: true
        type: choice
        options:
          - beta
          - prod

      offset:
        description: "Version offset (default is 0)"
        required: false
        type: number
        default: 0

permissions:
  contents: write


jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version tag (exclude beta)
        id: latest_version
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^open-pencil-server-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "Found latest stable tag: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "base_version=0.0.0" >> $GITHUB_OUTPUT
          else
            echo "base_version=${LATEST#open-pencil-server-v}" >> $GITHUB_OUTPUT
          fi

      - name: Compute new version
        id: version
        run: |
          BASE="${{ steps.latest_version.outputs.base_version }}"
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          OFFSET="${{ github.event.inputs.offset }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          
          if [ "$VERSION_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$VERSION_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          PATCH=$((PATCH + OFFSET))  # Apply offset to PATCH version
          
          VERSION="$MAJOR.$MINOR.$PATCH"
          
          if [ "$RELEASE_TYPE" = "beta" ]; then
            COUNT=$(git tag | grep "^open-pencil-server-v$VERSION-beta" | wc -l)
            VERSION="$VERSION-beta.$((COUNT + 1))"
          fi
          
          DOCKER_TAG="$VERSION"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "module=open-pencil-server" >> $GITHUB_OUTPUT

      - name: Show computed version
        run: |
          echo "✅ Computed version: ${{ steps.version.outputs.version }}"
          echo "🐳 Docker tag: ${{ steps.version.outputs.docker_tag }}"

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'
          cache: 'maven'

      - name: Verify module structure
        run: |
          echo "Verifying open-pencil-server module..."
          if [ ! -d "open-pencil-server" ]; then
            echo "::error::open-pencil-server module directory not found!"
            exit 1
          fi
          ls -la open-pencil-server/

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: ./
          file: server/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jongwong/open-pencil-server:${{ steps.version.outputs.docker_tag }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Tag and push version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag open-pencil-server-v${{ steps.version.outputs.version }}
          git push origin open-pencil-server-v${{ steps.version.outputs.version }}


      - name: Set up SSH and deploy
        env:
          SERVER_IP: 101.34.152.79
          SSH_PORT: 22
          USERNAME: root
          NEW_VERSION: ${{ steps.version.outputs.docker_tag }}
          PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          
          # 写入私钥
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 配置 SSH，跳过 host key 检查
          echo "Host $SERVER_IP
           Port $SSH_PORT
           User $USERNAME
           IdentityFile ~/.ssh/id_rsa
           StrictHostKeyChecking no
          " > ~/.ssh/config
          
          
          echo "Replacing docker tag in remote docker-compose.yml..."
          ssh $USERNAME@$SERVER_IP "sed -i 's|image: registry.cn-hangzhou.aliyuncs.com/jongwong/open-pencil-server:.*|image: registry.cn-hangzhou.aliyuncs.com/jongwong/open-pencil-server:${NEW_VERSION}|' /data/docker-mnt/open-pencil-server-docker-compose.yml"

          echo "Restarting container..."
          ssh $USERNAME@$SERVER_IP "cd /data/docker-mnt && nerdctl compose -f open-pencil-server-docker-compose.yml up -d "
